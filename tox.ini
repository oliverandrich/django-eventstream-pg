[tox]
isolated_build = true
envlist =
    django52-py{312,313,314,315}
    django60-py{312,313,314,315}
    django61-py{312,313,314,315}

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
set_env =
    PYTHONDEVMODE = 1
# The database settings in tests/settings.py come from these variables.
pass_env =
    POSTGRES_*
# Exclude django from the uv sync so commands_pre can install the factor's Django version.
uv_sync_flags = --no-install-package, django
commands_pre =
    django52: uv pip install "Django>=5.2a1,<6"
    django60: uv pip install "Django>=6.0a1,<6.1"
    django61: uv pip install "Django>=6.1a1,<6.2"
commands =
    pytest
